<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Maitri! 🎉</title>
  <style>
    :root {
      --bg-color: #ffe6ee;
      --card-bg: #ffffff;
      --primary: #ff4d8d;
      --text: #4a4a4a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px 50px 15px;
      overflow-x: hidden;
      position: relative;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }

    .card {
      background: var(--card-bg);
      max-width: 500px;
      width: 100%;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(255, 77, 141, 0.2);
      padding: 30px 20px;
      text-align: center;
      margin-top: 10px;
      z-index: 10;
    }

    h1 {
      font-size: 2.2rem;
      color: var(--primary);
      margin-bottom: 10px;
      animation: bounce 2s infinite;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 25px;
    }

    .quote-box {
      background: #fff0f5;
      border-left: 4px solid var(--primary);
      padding: 15px;
      border-radius: 8px;
      font-style: italic;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .meme-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 25px;
    }

    .meme-card {
      background: #fafafa;
      border-radius: 12px;
      padding: 10px;
      border: 1px solid #ffe0ec;
    }

    .meme-card img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      max-height: 250px;
      object-fit: cover;
    }

    .meme-caption {
      margin-top: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #333;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 77, 141, 0.3);
      transition: transform 0.2s, background 0.2s;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .floating-heart {
      position: absolute;
      color: var(--primary);
      animation: floatUp 4s linear forwards;
      pointer-events: none;
      font-size: 20px;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <main class="card">
    <h1>Happy Birthday, Maitri! 💕</h1>
    <p class="subtitle">Wishing you the sweetest day ever!</p>

    <div class="quote-box">
      "May your birthday be filled with endless smiles, sweet memories, and as much joy as you bring to everyone around you!"
    </div>

    <div class="meme-grid">
      <div class="meme-card">
        <img src="https://placekitten.com/400/300" alt="Cute kitten celebrate meme">
        <p class="meme-caption">Me waiting for Maitri's birthday party cake! 🎂</p>
      </div>

      <div class="meme-card">
        <img src="https://images.unsplash.com/photo-1537151625747-768eb6cf92b2?auto=format&fit=crop&w=400&q=80" alt="Cute happy dog">
        <p class="meme-caption">Scientifically proven: Today is 100% Maitri's Day! ✨</p>
      </div>
    </div>

    <button class="btn" onclick="triggerBurst()">Click for Extra Love! ❤️</button>
  </main>

  <script>
    // Confetti Setup
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = [];
    const colors = ['#ff4d8d', '#ff94b8', '#ffcc00', '#66d9ef', '#ae81ff'];

    for (let i = 0; i < 80; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height - height,
        size: Math.random() * 8 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        speed: Math.random() * 3 + 1,
        angle: Math.random() * 360
      });
    }

    function renderConfetti() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        p.y += p.speed;
        p.angle += 2;
        if (p.y > height) {
          p.y = -10;
          p.x = Math.random() * width;
        }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.angle * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      });
      requestAnimationFrame(renderConfetti);
    }
    renderConfetti();

    // Floating Hearts Action
    function triggerBurst() {
      for (let i = 0; i < 15; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.className = 'floating-heart';
          heart.innerText = ['💖', '🎂', '✨', '🌸'][Math.floor(Math.random() * 4)];
          heart.style.left = Math.random() * 80 + 10 + 'vw';
          heart.style.bottom = '10px';
          document.body.appendChild(heart);

          setTimeout(() => heart.remove(), 4000);
        }, i * 100);
      }
    }
  </script>
</body>
</html>
